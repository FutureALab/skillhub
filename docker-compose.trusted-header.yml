# Trusted-header ("标头认证") test stack.
#
# The `gateway` service is nginx sitting in front of the SkillHub backend. It injects
#   X-Auth-Request-User / X-Forwarded-Email / X-Skillhub-Proxy-Secret
# onto every request it forwards, i.e. exactly what a forward-auth gateway (oauth2-proxy,
# Authelia, Authentik, nginx auth_request ...) does in production. The backend runs with
# skillhub.auth.trusted-header.enabled=true and per-request-authentication=true, so the first
# request through the gateway signs the user in without any login page.
#
# Both application images are the published v0.2.224 artifacts — nothing is built from source, so
# the stack starts exactly what a release ships. Override the tags with TRUSTED_HEADER_SERVER_IMAGE /
# TRUSTED_HEADER_GATEWAY_IMAGE if you want to test a different release.
#
# Usage:
#   make trusted-header-test          # up + smoke test
#   make trusted-header-smoke         # re-run the assertions
#   make trusted-header-test-down     # stop and remove
#
# Or directly (the images must be present locally or pullable):
#   docker compose -p skillhub-th -f docker-compose.trusted-header.yml up -d --wait
#
# Endpoints:
#   http://localhost:8081   gateway — headers injected, this is the "behind the gateway" path
#   http://localhost:18080  backend directly — proves that bypassing the gateway is rejected
#
# The stack is self-contained: its own project name, volumes and networks, and the database ports
# are not published, so it can run next to `make dev-all` without conflicts.
#
# NOTE: the gateway image is currently only published for linux/amd64, so on Apple Silicon it runs
# under emulation (harmless for a test, just slower to start).
services:
  postgres:
    image: ${TRUSTED_HEADER_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: skillhub
      POSTGRES_USER: skillhub
      POSTGRES_PASSWORD: skillhub_dev
    volumes:
      - th_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${TRUSTED_HEADER_REDIS_IMAGE:-redis:7-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${TRUSTED_HEADER_SERVER_IMAGE:-ghcr.io/futurealab/skillhub-server:v0.2.224}
    ports:
      # Published on purpose: the smoke test uses it to prove that a direct request without valid
      # gateway headers is rejected.
      - "127.0.0.1:18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skillhub
      SPRING_DATASOURCE_USERNAME: skillhub
      SPRING_DATASOURCE_PASSWORD: skillhub_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_COOKIE_SECURE: "false"
      SKILLHUB_PUBLIC_BASE_URL: http://localhost:8081
      DEVICE_AUTH_VERIFICATION_URI: http://localhost:8081/cli/auth
      SKILLHUB_STORAGE_PROVIDER: local
      STORAGE_BASE_PATH: /var/lib/skillhub/storage
      SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET: trusted-header-test-download-secret-32-bytes
      # Password login stays available as a comparison path (admin / ChangeMe!2026).
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: "ChangeMe!2026"
      OAUTH2_GITHUB_CLIENT_ID: local-placeholder
      OAUTH2_GITHUB_CLIENT_SECRET: local-placeholder
      SKILLHUB_SECURITY_SCANNER_ENABLED: "false"

      # --- the feature under test -------------------------------------------------------------
      SKILLHUB_AUTH_TRUSTED_HEADER_ENABLED: "true"
      # Every request carrying the headers authenticates itself; no login page, no bootstrap call.
      SKILLHUB_AUTH_TRUSTED_HEADER_PER_REQUEST_AUTHENTICATION: "true"
      # The headers also replace an already authenticated session, so an embedding page can switch
      # the identity with its cookie even when the browser still holds an older SESSION cookie.
      SKILLHUB_AUTH_TRUSTED_HEADER_SESSION_OVERRIDE: "true"
      SKILLHUB_AUTH_TRUSTED_HEADER_PROVIDER_CODE: forward-auth
      SKILLHUB_AUTH_TRUSTED_HEADER_DISPLAY_NAME: Test Gateway
      SKILLHUB_AUTH_TRUSTED_HEADER_USER_HEADER: X-Auth-Request-User
      SKILLHUB_AUTH_TRUSTED_HEADER_EMAIL_HEADER: X-Forwarded-Email
      SKILLHUB_AUTH_TRUSTED_HEADER_SHARED_SECRET_HEADER: X-Skillhub-Proxy-Secret
      # `${VAR-default}` (no colon): an explicitly empty TRUSTED_HEADER_TEST_SECRET disables the
      # shared-secret check and the smoke test then skips the mismatch assertions.
      SKILLHUB_AUTH_TRUSTED_HEADER_SHARED_SECRET: ${TRUSTED_HEADER_TEST_SECRET-trusted-header-test-secret}
    volumes:
      - th_storage:/var/lib/skillhub/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  gateway:
    image: ${TRUSTED_HEADER_GATEWAY_IMAGE:-ghcr.io/futurealab/skillhub-web:v0.2.224}
    ports:
      - "127.0.0.1:8081:80"
    environment:
      # nginx only; the SPA is served from the same image.
      TRUSTED_HEADER_UPSTREAM: http://server:8080
      TRUSTED_HEADER_TEST_USER: ${TRUSTED_HEADER_TEST_USER:-gateway-user-1}
      TRUSTED_HEADER_TEST_EMAIL: ${TRUSTED_HEADER_TEST_EMAIL:-gateway-user-1@example.com}
      TRUSTED_HEADER_TEST_SECRET: ${TRUSTED_HEADER_TEST_SECRET-trusted-header-test-secret}
      # Same-origin API calls, and no client-side SSO entry: the headers do the work.
      SKILLHUB_WEB_API_BASE_URL: ""
      SKILLHUB_WEB_AUTH_DIRECT_ENABLED: "false"
      SKILLHUB_WEB_AUTH_SESSION_BOOTSTRAP_ENABLED: "false"
    volumes:
      - ./docker/trusted-header/00-proxy-headers.conf.template:/etc/nginx/templates/00-proxy-headers.conf.template:ro
      - ./docker/trusted-header/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  th_postgres_data:
  th_storage:
